<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a2f"/>
      <stop offset="1" stop-color="#121a16"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bcc0"/>
      <stop offset="1" stop-color="#8b8f95"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8823a"/>
      <stop offset="1" stop-color="#a95a1f"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- ears -->
  <path d="M120 170 L140 70 L215 135 Z" fill="#7d8187"/>
  <path d="M392 170 L372 70 L297 135 Z" fill="#7d8187"/>
  <path d="M140 150 L150 98 L192 136 Z" fill="#2a2d31"/>
  <path d="M372 150 L362 98 L320 136 Z" fill="#2a2d31"/>
  <!-- head -->
  <ellipse cx="256" cy="230" rx="146" ry="122" fill="url(#fur)"/>
  <!-- white brows / cheeks -->
  <path d="M120 230 Q150 150 256 168 Q362 150 392 230 Q330 205 256 212 Q182 205 120 230 Z" fill="#eef0f2"/>
  <!-- mask -->
  <path d="M112 248 Q140 196 214 214 Q240 222 256 238 Q272 222 298 214 Q372 196 400 248 Q384 290 330 286 Q290 282 256 262 Q222 282 182 286 Q128 290 112 248 Z" fill="#23262a"/>
  <!-- eyes (half closed, enjoying the coffee) -->
  <path d="M168 248 Q190 232 212 248" stroke="#f4f4f4" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M300 248 Q322 232 344 248" stroke="#f4f4f4" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="256" cy="300" rx="70" ry="48" fill="#eef0f2"/>
  <ellipse cx="256" cy="282" rx="22" ry="15" fill="#1d1f22"/>
  <!-- steam -->
  <path d="M392 330 C372 300 410 286 388 252" stroke="#e8e8e8" stroke-opacity="0.8" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M426 318 C408 292 442 280 422 250" stroke="#e8e8e8" stroke-opacity="0.6" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- mug -->
  <path d="M190 330 H322 L310 452 Q306 470 288 470 H224 Q206 470 202 452 Z" fill="url(#mug)"/>
  <path d="M322 352 Q372 352 368 396 Q364 436 312 432" stroke="#a95a1f" stroke-width="18" fill="none" stroke-linecap="round"/>
  <ellipse cx="256" cy="332" rx="66" ry="12" fill="#4a2a12"/>
  <!-- coffee bean on mug -->
  <ellipse cx="256" cy="400" rx="20" ry="28" fill="#5a3216" transform="rotate(-20 256 400)"/>
  <path d="M248 378 Q262 400 250 424" stroke="#d8823a" stroke-width="5" fill="none" transform="rotate(-20 256 400)"/>
  <!-- paws holding the mug -->
  <ellipse cx="190" cy="408" rx="30" ry="26" fill="#6f7379"/>
  <ellipse cx="324" cy="408" rx="30" ry="26" fill="#6f7379"/>
  <path d="M174 400 h28 M174 414 h28" stroke="#4d5055" stroke-width="5" stroke-linecap="round"/>
  <path d="M310 400 h28 M310 414 h28" stroke="#4d5055" stroke-width="5" stroke-linecap="round"/>
</svg>
